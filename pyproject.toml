[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzo-gimp-mcp"
version = "1.0.0"
description = "Clean-room BSD-3 GIMP 3.0 bridge: a GIMP plug-in exposing a JSON-over-TCP protocol that drives GIMP through its documented PDB API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "gimp", "mcp", "pdb", "image", "bridge", "bsd-3-clause"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/hanzoai/gimp-mcp"
Repository = "https://github.com/hanzoai/gimp-mcp"

# This package ships a single GIMP 3.0 plug-in module that you copy into the
# GIMP plug-ins directory (see README). It is not a conventional importable
# library, so no package discovery is configured.
